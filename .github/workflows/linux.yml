# Builds the runtime library on Linux.
#
# Linux was the last platform with no CI and no evidence: the POSIX paths were
# there, README listed the whole column as "untested", and nobody had ever run
# a compiler over it. Two real defects were sitting in that gap -- an
# Apple-only QueryPerformanceCounter shim reached from a shared translation
# unit, and a Darwin-only pthread_threadid_np called from the POSIX branch of
# win32_compat.h. This job is what stops the next two from accumulating.
#
# Both compilers, deliberately. GCC accepted the pthread_threadid_np call as an
# implicit declaration and produced an archive that would only have failed when
# something finally linked it; Clang rejected it outright. A single-compiler
# matrix would have shipped that bug.
#
# The graphics step runs against the null backend's headless software path,
# which is what gives Linux an end-to-end check without a GPU, a display, or a
# render backend of its own.
name: Linux

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Linux x64 (${{ matrix.compiler }}, ${{ matrix.build_type }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
        build_type: [Debug, Release]

    steps:
      - uses: actions/checkout@v4

      # SDL2 is not optional off Windows: cellPad and cellAudio select their
      # SDL2 backends unconditionally there, and CMakeLists.txt hard-fails
      # without it.
      # glslang and spirv-cross are what the Metal backend's guest-shader path
      # translates with. There is no Metal here, but the translation itself
      # has no GPU in it, so Linux is where the decompilers' HLSL meets
      # glslang's front end on every push. glslang-tools is not used, but
      # Ubuntu's glslang CMake config declares the standalone binary as an
      # imported target and refuses to load while /usr/bin/glslang is absent.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev clang \
            glslang-dev glslang-tools spirv-tools libspirv-cross-c-shared-dev

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            CC=clang CXX=clang++ cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          else
            CC=gcc CXX=g++ cmake -S . -B build -G Ninja \
              -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          fi

      - name: Build
        run: cmake --build build

      - name: Verify the archive exists and is x86-64
        run: |
          test -f build/libps3recomp_runtime.a
          file build/libps3recomp_runtime.a
          # An archive links nothing, so a bad extern survives the build. Catch
          # the undefined symbols the compiler let through -- this is exactly
          # how pthread_threadid_np hid from GCC.
          nm --undefined-only build/libps3recomp_runtime.a \
            | awk '{print $2}' | sort -u > /tmp/undef.txt
          if grep -qE '^(pthread_threadid_np|QueryPerformance|GetTickCount64)' /tmp/undef.txt; then
            echo "Win32/Darwin-only symbol left undefined in a POSIX build:"
            grep -E '^(pthread_threadid_np|QueryPerformance|GetTickCount64)' /tmp/undef.txt
            exit 1
          fi

      # The Python suites are the project's real correctness net -- the
      # conformance one compiles and runs 1300+ lifted instruction cases with
      # the host compiler, so it is genuinely testing this platform's codegen
      # and not just re-checking the lifter's Python.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run the lifter test suites
        env:
          CI: "1"          # makes a skipped conformance run fail instead of passing
        run: |
          set -e
          for t in tools/test_*.py; do
            echo "--- $t"
            python "$t"
          done

      - name: Run self-contained SPU helper tests
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} \
            -std=gnu17 -I include -I runtime/spu \
            -o /tmp/test_spu_helpers runtime/spu/tests/test_spu_helpers.c
          /tmp/test_spu_helpers

      # An SPU parked on a GETLLAR reservation has to be told when the PPU
      # writes that line. Nothing else in the tree fails when that notify is
      # missing -- the SPU just never wakes -- so it gets its own check.
      - name: Run the PPU/SPU lock-line coherence tests
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} \
            -std=gnu17 -I include -I runtime/spu \
            -o /tmp/test_spu_coherency runtime/spu/tests/test_spu_coherency.c
          /tmp/test_spu_coherency

      # The other writer: an SPU. Five SPURS kernels share one management line,
      # so a commit that does not break its peers' reservations lets two of them
      # win the same compare-and-swap, and the queue is quietly wrong afterwards.
      - name: Run the SPU-to-SPU lock-line coherence tests
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} \
            -std=gnu17 -I include -I runtime/spu -I runtime/platform \
            -o /tmp/test_spu_lockline_peer \
            runtime/spu/tests/test_spu_lockline_peer.c \
            runtime/spu/spu_drain.c runtime/spu/spu_lockstep.c \
            runtime/spu/spu_coherency.c runtime/spu/spu_workload.c \
            runtime/spu/spurs_policy.c runtime/spu/spurs_job.c \
            runtime/spu/spu_tsp_weak.c runtime/spu/spu_vm_pagemap.c \
            runtime/spu/spurs_policy_blob_weak.c runtime/spu/spu_interp.c \
            runtime/platform/win32_compat.c -lpthread -lm
          /tmp/test_spu_lockline_peer

      # A thread group starting its threads on their image's LIFTED code. This
      # is the path a real title needs and the one that used to be missing: the
      # group's threads completed instantly with status 0, the group reported a
      # clean exit, and the program the guest asked to run had simply not run.
      # Nothing else in the tree fails when that happens, so it gets its own
      # check. The real lv2 SPU-thread layer and the real SPU dispatcher are
      # compiled in, and the two threads have to run concurrently on host
      # threads of their own, with the image in their local stores, the entry
      # point and image the registry says, and each thread's own arguments.
      - name: Run the lifted SPU thread-group start test
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} \
            -std=gnu17 -I include -I runtime/spu -I runtime/platform \
            -o /tmp/test_spu_lifted_start \
            runtime/spu/tests/test_spu_lifted_start.c \
            runtime/spu/spu_channels.c runtime/spu/spu_drain.c \
            runtime/spu/spu_lockstep.c runtime/spu/spu_coherency.c \
            runtime/spu/spu_workload.c runtime/spu/spurs_policy.c \
            runtime/spu/spurs_job.c runtime/spu/spu_tsp_weak.c \
            runtime/spu/spu_vm_pagemap.c runtime/spu/spurs_policy_blob_weak.c \
            runtime/spu/spu_interp.c runtime/spu/spu_lifted_thread.c \
            runtime/syscalls/spu_fallback.c runtime/syscalls/sdk_version_weak.c runtime/platform/win32_compat.c \
            -lpthread -lm
          /tmp/test_spu_lifted_start

      # The per-context MFC engine table, which the group above writes from
      # every one of its threads at once. Two threads claiming the same slot
      # share one engine's queue and tag mask, so one SPU's tag wait is
      # satisfied by the other's transfer and nothing says so; slots that are
      # never given back put every context past the eighth on one shared
      # engine. Eight contexts claim on the same instant, thirty-two times
      # over, and the check is that the same eight engines come back around,
      # each one clean and holding only its own owner's state.
      - name: Run the SPU MFC engine slot test
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} \
            -std=gnu17 -I include -I runtime/spu -I runtime/platform \
            -o /tmp/test_spu_mfc_slots \
            runtime/spu/tests/test_spu_mfc_slots.c \
            runtime/spu/spu_drain.c runtime/spu/spu_lockstep.c \
            runtime/spu/spu_coherency.c runtime/spu/spu_workload.c \
            runtime/spu/spurs_policy.c runtime/spu/spurs_job.c \
            runtime/spu/spu_tsp_weak.c runtime/spu/spu_vm_pagemap.c \
            runtime/spu/spurs_policy_blob_weak.c runtime/spu/spu_interp.c \
            runtime/platform/win32_compat.c -lpthread -lm
          /tmp/test_spu_mfc_slots

      # Guest vertex and fragment programs through the decompilers, glslang
      # and spirv-cross: asserts the MSL carries the buffer, texture, sampler
      # and attribute slots the Metal backend binds to. The binary missing
      # means the shader tools were not found, which must fail, not skip.
      - name: Run the guest shader translation test
        run: |
          test -x build/test_shader_msl
          ./build/test_shader_msl

      # runtime/ppu/ is the one part of the runtime no CMake target builds --
      # it needs the lifter's per-game ppu_recomp.h -- so nothing here ever
      # compiled it and the POSIX port is unfinished. This ratchets the error
      # count: it fails if the scaffold gets WORSE, which is what keeps the
      # port from sliding backwards while it is being done.
      - name: Check the PPU boot scaffold (ratchet)
        env:
          CXX: ${{ matrix.compiler == 'clang' && 'clang++' || 'g++' }}
        run: python tools/check_ppu_scaffold.py

      # ...and this one RUNS it, which the ratchet cannot. The smoke title is a
      # synthetic lifted program that drives the loader, the NID bridge, the
      # lv2 syscalls, a guest thread, the frame clock and the RSX backend from
      # guest code and checks all of it; here the backend is the null one's
      # headless software path, so no GPU and no display are involved. Exit 0
      # means every marker appeared in order, the guest thread ran on its own
      # host thread, three frames reached the backend and the guest's chosen
      # exit status came back through sys_process_exit. The binary missing
      # means CMake skipped the target, which must fail rather than pass.
      - name: Run the PPU boot smoke title (null backend)
        run: |
          test -x build/ps3recomp_boot_smoke
          ./build/ps3recomp_boot_smoke build/smoke/smoke.elf

      # templates/project is what "start a port" means -- docs/GETTING_STARTED.md
      # says to copy it -- and until now nothing built it on any platform. This
      # is the same smoke title again, booted through the TEMPLATE's runner and
      # the template's own CMakeLists: the toolkit from PS3RECOMP_DIR, the lift
      # from RECOMP_DIR, exactly the two directories a real port passes. Exit 0
      # is the smoke title's own verdict, so a template that builds but boots
      # nothing cannot pass. Linux is also where the template's null-backend
      # branch is the one that runs.
      - name: Build and run the game template (null backend)
        run: |
          # pipefail, or tee below would swallow the runner's exit status --
          # which IS the smoke title's verdict.
          set -eo pipefail
          test -f build/smoke/lift/ppu_recomp.h
          if [ "${{ matrix.compiler }}" = "clang" ]; then
            export CC=clang CXX=clang++
          else
            export CC=gcc CXX=g++
          fi
          cmake -S templates/project -B build-template -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DPS3RECOMP_DIR="$PWD" \
            -DRECOMP_DIR="$PWD/build/smoke/lift"
          cmake --build build-template
          ./build-template/MyGameRecomp build/smoke/smoke.elf 2>&1 | tee template.log
          # The runner's own banner, so a pass cannot come from some other
          # binary, and the marker-order verdict spelt out rather than inferred
          # from the exit status alone.
          grep -q "=== ps3recomp game runner ===" template.log
          grep -q "\[smoke\] OK: all 11 markers, in order" template.log
          grep -q "\[smoke\] PASS" template.log

      # Drives a real NV4097 command buffer through cellGcm -> RSX -> the null
      # backend's headless software path and asserts the presented pixel. No
      # display and no GPU are involved, so exit 0 means the whole graphics
      # bridge is intact on Linux, not merely that it compiled.
      - name: Run the POSIX host (headless end-to-end)
        run: |
          # Clear + flip: asserts the guest clear colour reaches the framebuffer.
          ./build/ps3recomp_host
          # Clear + a real NV4097 draw: asserts the triangle covers the centre
          # pixel, which exercises guest vertex fetch, primitive expansion and
          # the draw path, not just the clear.
          ./build/ps3recomp_host --draw
          ./build/ps3recomp_host --draw --frames=60
          # Two triangles drawn near-first: the centre pixel is red only if the
          # depth test rejected the later far one.
          ./build/ps3recomp_host --depth
          # Bind a texture and sample it: the quad is green, the texture is
          # not, so a path that dropped the texture still draws something
          # plausible and still fails here. Exercises rsx_texture_layout and
          # rsx_texture_decode end to end with no GPU involved.
          ./build/ps3recomp_host --tex
          # A polygon and a quad strip, neither of which any host API draws:
          # both have to be expanded into triangles first. The pentagon is
          # green and the strip red over it, and the centre pixel belongs to
          # the strip's second quad, so a dropped or half-expanded strip is
          # green and fails.
          ./build/ps3recomp_host --quads
          # No graphics: create a guest PPU thread through the lv2 path and
          # check the host stack it got. A recompiled call chain nests on the
          # host stack one frame per guest call, so the default stack is not
          # enough and nothing says so until a title dies with no diagnosis.
          ./build/ps3recomp_host --threads
          # The SDL2 audio and pad backends, which the Windows build never
          # reaches (it takes WASAPI and XInput). The dummy audio driver and
          # no controller are the runner's situation and must both be fine.
          SDL_AUDIODRIVER=dummy ./build/ps3recomp_host --audio-pad

      # RSX texture layout -- format class, row sizes, Morton addressing. Pure
      # arithmetic with no host API in it, so it runs everywhere, and it is the
      # regression net for having lifted that maths out of the D3D12 uploader.
      - name: Run self-contained RSX tests
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -Wall -Wextra -I include -I libs/video -o /tmp/test_texture_layout libs/video/tests/test_texture_layout.c libs/video/rsx_texture_layout.c
          /tmp/test_texture_layout
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -Wall -Wextra -I include -I libs/video -o /tmp/test_rsx_primitives libs/video/tests/test_rsx_primitives.c
          /tmp/test_rsx_primitives
          # The fragment-program decoder on its own: the word swap, source
          # swizzles and types, the dest mask, inline constants, which
          # register file the colour export comes from, and how many
          # SV_TARGETs a program that writes more than one export gets. It
          # had rotted to the point of not compiling while nothing ran it.
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -Wall -Wextra -I include -o /tmp/test_fp_decompiler libs/video/tests/test_fp_decompiler.c libs/video/rsx_fp_decompiler.c
          /tmp/test_fp_decompiler
          # The register-file draw engine's platform-neutral halves, driven
          # through its dispatch sink against a stub backend: the surface set's
          # keying and reallocation, a texture unit that names a render target
          # sampling it rather than guest memory, the texture cache's
          # once-per-frame revalidation and its LRU eviction, the pipeline key
          # holding still while constants change, and restart cuts bounding
          # every topology expansion. No GPU and no host graphics API, so this
          # is where those get checked at all.
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -Wall -Wextra -Wno-unused-parameter -I include -I libs/video -o /tmp/test_rsx_draw_engine libs/video/tests/test_rsx_draw_engine.c libs/video/rsx_draw_engine.c libs/video/rsx_dispatch.c libs/video/rsx_vertex_compact.c libs/video/rsx_texture_layout.c libs/video/rsx_vp_decompiler.c libs/video/rsx_fp_decompiler.c
          /tmp/test_rsx_draw_engine

      # The Win32 shim every POSIX host runs the runtime through: interlocked
      # widths and return conventions, SRW/CS/condition variables, events,
      # semaphores, joinable threads, WaitOnAddress, timers, VirtualAlloc.
      - name: Run the Win32 compatibility layer tests
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -Wall -Wextra -I runtime/platform -o /tmp/test_win32_compat runtime/platform/tests/test_win32_compat.c runtime/platform/win32_compat.c -lpthread
          /tmp/test_win32_compat

      # Which signal an inaccessible guest window faults with, and whether one
      # can be reserved at all. runtime/ppu/ppu_loader.cpp's untranslated-guest-
      # pointer trap takes both SIGSEGV and SIGBUS because the two hosts answer
      # that differently; this is the evidence, and it needs no game, so it is
      # the one thing about that trap CI can actually run.
      - name: Run the guest-pointer trap signal test
        run: |
          ${{ matrix.compiler == 'clang' && 'clang' || 'gcc' }} -std=gnu17 -Wall -Wextra -o /tmp/test_guest_ptr_trap runtime/platform/tests/test_guest_ptr_trap.c
          /tmp/test_guest_ptr_trap

      # The lv2 sync-primitive stress suite (mutex, cond, semaphore, event
      # queue) on host threads. It was Windows-only until the shim grew joinable
      # handles and multi-object waits; here it is the memory-model regression
      # net for the same primitives a game hammers.
      - name: Build and run sync_stress
        run: |
          cmake -S tests/sync_stress -B build-sync-stress -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build build-sync-stress
          ctest --test-dir build-sync-stress --output-on-failure

      # cellFiber's cooperative switching on ucontext. glibc's ucontext_t is
      # not the one that bites, but running the suite on both hosts is what
      # tells a Darwin header problem from a logic error in the switch.
      - name: Build and run fiber_switch
        run: |
          cmake -S tests/fiber_switch -B build-fiber -G Ninja -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          cmake --build build-fiber
          ./build-fiber/fiber_switch
