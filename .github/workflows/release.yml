# Builds a downloadable SDK bundle for each supported platform and attaches it
# to the GitHub release when a v* tag is pushed.
#
# Why: a release with no binaries makes every would-be port author reproduce the
# whole toolchain setup (clang-cl + Ninja under vcvars) before they can even try
# the thing. The bundle is what a port actually consumes -- the runtime library,
# its public headers, and the Python pipeline -- so a port can be attempted with
# nothing but a tag download.
#
# Windows, macOS arm64 and Linux are built. Each has a dedicated CI workflow
# proving the same source revision before a tagged bundle is published.
name: Release

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:      # dry run: builds and uploads to the run, publishes nothing

# Least privilege. The write token exists for one step in one job -- attaching
# assets to the release -- so only that job gets it. Everything else in this
# file is read-only by default, which is also what any job added here later
# inherits unless it says otherwise.
permissions:
  contents: read

jobs:
  package:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.runs-on }}
    # A tag can point at any commit, and this job configures CMake, compiles the
    # tree and runs every tools/test_*.py under `python`. None of that writes to
    # the repository, so it must not hold a token that can push commits or move
    # tags. `contents: read` is what actions/checkout needs and no more; the
    # artifact upload authenticates with the runner's own token, not this one.
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: win-x64
            runs-on: windows-latest
          - platform: mac-arm64
            runs-on: macos-15
          # Linux ships as the toolkit and the runtime library, not a game
          # runner: it has no renderer (the null backend's headless software path
          # is a CI check, not a graphics backend) and the PPU boot scaffold does
          # not yet load a title on POSIX. VERSION.txt says so in the bundle.
          - platform: linux-x64
            runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
        with:
          arch: x64

      - name: Install dependencies (Windows)
        if: runner.os == 'Windows'
        run: choco install ninja -y --no-progress

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: brew install ninja sdl2

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ninja-build libsdl2-dev

      # clang-cl on Windows: the loader uses __builtin_bswap* and weak symbols
      # that plain MSVC does not provide (docs/BUILDING.md).
      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Windows" ]; then
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl
          else
            cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          fi

      - name: Build
        run: cmake --build build

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      # A tag can be pushed at any commit, including one that never went through
      # the push workflows. Re-running the suites here is what makes "downloaded
      # from a release" mean the same thing as "green on master".
      - name: Run the lifter test suites
        shell: bash
        env:
          CI: "1"
        run: |
          set -e
          for t in tools/test_*.py; do
            echo "--- $t"
            python "$t"
          done

      - name: Stage the bundle
        shell: bash
        run: |
          set -e
          # On a tag this is "v0.12.0". On a workflow_dispatch dry run it is the
          # BRANCH name, which may contain a slash -- "release/v0.12.0" made
          # dist/${NAME} a nested directory, so the zip landed in dist/release/
          # and the dist/*.zip upload glob found nothing. Every platform built and
          # tested fine and the run still failed, which is the least useful way
          # for a dry run to fail.
          VER="${GITHUB_REF_NAME//\//-}"
          NAME="ps3recomp-${VER}-${{ matrix.platform }}"
          STAGE="dist/${NAME}"

          # lib/ + include/ come from the project's own install rules, so the
          # bundle layout cannot drift from what a local `cmake --install` gives.
          cmake --install build --prefix "${STAGE}"

          # Keep the bundle source-layout compatible with PS3RECOMP_DIR. A port
          # needs more than the installed archive: the project template compiles
          # the per-title PPU scaffold, gen_hle_nids.py scans libs/, and SPU
          # projects include cmake/PS3RecompSPU.cmake. Shipping those together
          # makes the downloaded SDK usable without a second source checkout.
          cp CMakeLists.txt requirements.txt "${STAGE}/"
          cp -R cmake libs runtime templates third_party tools "${STAGE}/"
          find "${STAGE}" -name __pycache__ -type d -prune -exec rm -rf {} +   # test-run leftovers
          cp README.md CHANGELOG.md CONTRIBUTING.md CONTRIBUTORS.md LICENSE CITATION.cff "${STAGE}/"
          mkdir -p "${STAGE}/docs" && cp docs/*.md "${STAGE}/docs/"

          # What this bundle can actually do, per platform. Someone who
          # downloads the Linux zip expecting to run a game should find that out
          # here rather than after building one.
          case "${{ matrix.platform }}" in
            win-x64)    CAN="renders and runs recompiled titles (D3D12)" ;;
            mac-arm64)  CAN="renders through Metal; the bundled project template boots the synthetic PPU smoke title, but no retail title has been validated in this tree" ;;
            linux-x64)  CAN="the bundled project template boots the synthetic PPU smoke title through the headless null backend; Vulkan is opt-in (-DPS3RECOMP_RSX_VULKAN=ON), and no retail title has been validated in this tree" ;;
            *)          CAN="unknown" ;;
          esac

          { echo "ps3recomp ${VER}"
            echo "platform: ${{ matrix.platform }}"
            echo "commit:   ${GITHUB_SHA}"
            echo "run:      ${{ github.run_id }}"
            echo
            echo "status:   ${CAN}"; } > "${STAGE}/VERSION.txt"

          # Exercise the staged POSIX SDK, not the checkout. This catches a
          # missing template/support file before the archive is published and
          # proves that PS3RECOMP_DIR may point at the extracted bundle.
          if [ "$RUNNER_OS" != "Windows" ]; then
            BUNDLE_ROOT="$PWD/${STAGE}"
            test -f build/smoke/lift/ppu_recomp.h
            cmake -S "${BUNDLE_ROOT}/templates/project" -B build-bundle-template -G Ninja \
              -DCMAKE_BUILD_TYPE=Release \
              -DPS3RECOMP_DIR="${BUNDLE_ROOT}" \
              -DRECOMP_DIR="$PWD/build/smoke/lift"
            cmake --build build-bundle-template
            PS3RECOMP_METAL_HEADLESS=1 ./build-bundle-template/MyGameRecomp \
              build/smoke/smoke.elf > bundle-template.log 2>&1
            grep -q "\[smoke\] OK: all 11 markers, in order" bundle-template.log
            grep -q "\[smoke\] PASS" bundle-template.log
          fi

          # cmake -E tar rather than zip/Compress-Archive: CMake is already a
          # hard requirement on both runners, so this is one code path instead of
          # a per-platform branch.
          ( cd dist && cmake -E tar cf "${NAME}.zip" --format=zip "${NAME}" )
          ls -la dist/

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ps3recomp-${{ matrix.platform }}
          path: dist/*.zip
          if-no-files-found: error

  publish:
    name: Attach to release
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    # `gh release create` and `gh release upload` below are the only things in
    # this workflow that need to write. Releases sit in the `contents` scope --
    # there is no narrower `releases` scope to ask for -- so this is the
    # smallest permission that still publishes. The artifact download needs
    # nothing from this token: it reads artifacts from its own run, and
    # `actions: read` is only required when pulling from another run or repo.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum *.zip | tee SHA256SUMS.txt

      - name: Upload
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -e
          TAG="${GITHUB_REF_NAME}"
          # The release usually already exists (tagged and written by hand);
          # create one only if it does not, so hand-written notes survive.
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "$TAG" --generate-notes
          gh release upload "$TAG" dist/*.zip dist/SHA256SUMS.txt --clobber
