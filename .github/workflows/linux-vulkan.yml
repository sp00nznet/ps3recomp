# Builds the opt-in Vulkan RSX backend and runs every ps3recomp_host scene on
# it, with Mesa's lavapipe standing in for a GPU (a CPU Vulkan driver, so the
# runner needs none).
#
# Two passes, one per draw path:
#   - without guest programs, the rsx_state vtable's fixed-function path: the
#     same scenes the null-backend job checks, now through Vulkan;
#   - with guest programs, the shared register-file draw engine (the path the
#     Metal backend takes): all twelve draw scenes, including the ones only a
#     translating backend can pass (--shader, --mip, --rtt, --depthtex, --mrt,
#     --mrt-a, --cube), plus --depthbounds, which only this backend's engine
#     implements, under the Khronos validation layer.
#
# The second pass fails on any of: a scene's own check, a single validation
# message, a scene that did not take the engine path, or one that reported
# "nothing to check" -- a skipped scene is not a passed one.
name: Linux (Vulkan)

on:
  push:
    branches: [ master, main ]
  pull_request:
  workflow_dispatch:

jobs:
  vulkan:
    name: Linux x64 Vulkan on lavapipe (${{ matrix.compiler }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc, clang]
    env:
      VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.json

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # As in linux.yml: SDL2 is required off Windows, and Ubuntu's glslang
      # CMake config refuses to load without glslang-tools. spirv-tools is
      # what glslang's HLSL legalization runs on -- without it the translator
      # emits different, possibly invalid, SPIR-V. The Vulkan headers build
      # the backend (libvulkan itself is loaded at run time); lavapipe is in
      # mesa-vulkan-drivers; the validation layer is its own package.
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libsdl2-dev clang \
            glslang-dev glslang-tools spirv-tools \
            libvulkan-dev mesa-vulkan-drivers vulkan-validationlayers

      - name: Configure
        run: |
          if [ "${{ matrix.compiler }}" = "clang" ]; then export CC=clang CXX=clang++; else export CC=gcc CXX=g++; fi
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DPS3RECOMP_RSX_VULKAN=ON | tee configure.log
          # Without glslang the second pass would only ever skip: say so here.
          grep -q "Vulkan: *guest programs available" configure.log

      - name: Build
        run: cmake --build build --target ps3recomp_host

      # The HLSL -> SPIR-V translation cache: a repeat is served from memory,
      # PS3RECOMP_SPIRV_CACHE's files serve the next run, a damaged file is a
      # miss. Needs glslang, which configure has already checked for.
      - name: SPIR-V translation cache test
        run: |
          cmake --build build --target test_shader_spirv
          ./build/test_shader_spirv

      # PS3RECOMP_VK_DIRECT_PRESENT: a direct engine present (no read-back, no
      # CPU wait) must leave the same frame a read-back present does, with
      # the validation layer's synchronization checks on, unbatched and
      # under VK_DRAW_BATCH.
      - name: Direct and read-back engine presents
        env:
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          cmake --build build --target test_vulkan_direct_present
          printf 'khronos_validation.validate_core = true\nkhronos_validation.validate_sync = true\n' > vk_layer_settings.txt
          export VK_LAYER_SETTINGS_PATH=$PWD/vk_layer_settings.txt
          fail=0
          for batch in 0 1; do
            for direct in 0 1; do
              rc=0
              VK_DRAW_BATCH=$batch PS3RECOMP_VK_DIRECT_PRESENT=$direct \
                ./build/test_vulkan_direct_present "batch$batch" "frame-$batch-$direct.bin" > run.log 2>&1 || rc=$?
              echo "::group::batch=$batch direct=$direct -> exit $rc"; cat run.log; echo "::endgroup::"
              [ "$rc" -eq 0 ] || { echo "::error::batch=$batch direct=$direct: exit $rc"; fail=1; }
              if grep -qE "VUID|SYNC-HAZARD" run.log; then echo "::error::batch=$batch direct=$direct: validation messages"; fail=1; fi
              if grep -q "SKIP" run.log; then echo "::error::batch=$batch direct=$direct: skipped"; fail=1; fi
            done
            cmp "frame-$batch-0.bin" "frame-$batch-1.bin" || { echo "::error::batch=$batch: direct and read-back frames differ"; fail=1; }
          done
          exit $fail

      - name: Fixed-function path (no guest programs)
        run: |
          fail=0
          for m in "" "--draw" "--draw --frames=60" "--depth" "--tex" "--tex-io" "--quads" "--threads" "--split-present"; do
            rc=0; ./build/ps3recomp_host $m > run.log 2>&1 || rc=$?
            echo "::group::ps3recomp_host ${m:-(default)} -> exit $rc"; cat run.log; echo "::endgroup::"
            [ "$rc" -eq 0 ] || { echo "::error::${m:-default}: exit $rc"; fail=1; }
          done
          exit $fail

      - name: Draw engine with guest programs, under the validation layer
        env:
          PS3RECOMP_VK_GUEST_PROGRAMS: "1"
          VK_INSTANCE_LAYERS: VK_LAYER_KHRONOS_validation
        run: |
          fail=0
          # --threads is not here: it checks guest thread stacks and returns
          # before any backend exists (the first pass still runs it).
          for m in "" "--draw" "--depth" "--quads" "--shader" \
                   "--tex" "--tex-io" "--mip" "--rtt" "--depthtex" "--mrt" "--mrt-a" "--cube" \
                   "--depthbounds" "--split-present" "--feedback" "--clip" "--clip-keep" \
                   "--float-rt" "--float-rt-r"; do
            rc=0; ./build/ps3recomp_host $m > run.log 2>&1 || rc=$?
            name=${m:-default}
            echo "::group::ps3recomp_host $name -> exit $rc"; cat run.log; echo "::endgroup::"
            [ "$rc" -eq 0 ] || { echo "::error::$name: exit $rc"; fail=1; }
            if grep -q "VUID" run.log; then echo "::error::$name: Vulkan validation messages"; fail=1; fi
            grep -q "register-file draw engine path" run.log || { echo "::error::$name: not on the draw engine"; fail=1; }
            if grep -q "nothing to check" run.log; then echo "::error::$name: skipped, not checked"; fail=1; fi
            # The one scene that needs an optional device feature: lavapipe has no
            # depthBounds in every Mesa release, so its skip is a notice, not a
            # pass and not a failure.
            if [ "$name" = "--depthbounds" ] && grep -q "skipped, no depth bounds test" run.log; then
              echo "::notice::$name: skipped, this lavapipe has no depthBounds"
            fi
          done
          exit $fail
